name: SE agent routing

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to initialize or reconcile
        required: true
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: se-routing-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  route:
    if: github.event_name == 'workflow_dispatch' || (!github.event.issue.pull_request && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    steps:
      # Only the trusted default-branch router executes, never issue/PR content.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { route } = require('./.github/scripts/issue-routing.cjs');
            await route({ github, context, core });
